name: Validate Supabase schema

on:
  push:
    branches:
      - main
      - audit/**
      - architecture/**
    paths:
      - "supabase/migrations/**"
      - "supabase/bootstrap/**"
      - "supabase/README.md"
      - "supabase/tests/**"
      - "supabase/seed/**"
      - ".github/workflows/schema-smoke.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/bootstrap/**"
      - "supabase/README.md"
      - "supabase/tests/**"
      - "supabase/seed/**"
      - ".github/workflows/schema-smoke.yml"

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create minimal Supabase Auth compatibility layer
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Model existing Supabase default API grants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;
          SQL
      - name: Apply schema migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap/202610160001_initial_schema.sql
      - name: Minimize API table privileges
        run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap/202610170001_minimize_api_table_privileges.sql
      - name: Apply sensitive update guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap/202610170002_guard_sensitive_updates.sql
      - name: Revoke anonymous table privileges
        run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap/202610170004_revoke_anon_table_privileges.sql
      - name: Restrict function execution
        run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap/202610170005_restrict_function_execution.sql
      - name: Revoke internal function execution
        run: psql -v ON_ERROR_STOP=1 -f supabase/bootstrap/202610170006_revoke_internal_function_execution.sql
      - name: Enforce unique establishment source references
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017023117_unique_establishment_source_ref.sql
      - name: Seed Granada province
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017023120_seed_granada_province.sql
      - name: Apply personal state migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017031513_create_user_app_state.sql
      - name: Apply shared establishment state migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017032027_create_establishment_app_state.sql
      - name: Harden authorization function exposure
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017092625_harden_authorization_function_exposure.sql
      - name: Load reference catalogs
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed/reference_catalog.sql
      - name: Reconcile categories to map taxonomy
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017114356_reconcile_categories_to_map_taxonomy.sql
      - name: Improve composite-key audit
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017114643_audit_composite_keys_user_provinces.sql
      - name: Add uncovered foreign-key indexes
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017120547_index_uncovered_foreign_keys.sql
      - name: Split administrator RLS policies
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017120731_split_admin_rls_policies.sql
      - name: Apply master catalogue write restrictions
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017125817_restrict_establishment_master_writes.sql
      - name: Guard shared state identity and province
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017130854_guard_establishment_app_state.sql
      - name: Revoke direct execution of shared-state trigger
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017151957_revoke_guard_establishment_app_state_execute.sql
      - name: Minimize personal and shared state table privileges
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017152419_minimize_state_table_privileges.sql
      - name: Revoke state timestamp trigger RPC execution
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017164429_20261017164000_revoke_state_timestamp_trigger_execute.sql
      - name: Fix follow-up update guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017172240_fix_followup_update_guard.sql
      - name: Require active profiles for personal app state
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017194119_require_active_user_for_personal_state.sql
      - name: Preserve applied personal-state migration version
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017201136_protect_user_app_state_created_at.sql
      - name: Restrict default function execution
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017210223_restrict_default_function_execution.sql
      - name: Revoke direct access to audit sequence
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017220309_revoke_public_audit_log_sequence_privileges.sql
      - name: Protect profile identity from reassignment
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017221000_protect_profile_identity.sql
      - name: Restrict location proposal insert decisions
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017221500_restrict_location_review_insert_decisions.sql
      - name: Protect personal state creation timestamp
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261017222500_protect_user_app_state_created_at.sql
      - name: Revoke default API object privileges
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261018002000_revoke_default_api_object_privileges.sql
      - name: Run schema, trigger, and RLS smoke tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke.sql
