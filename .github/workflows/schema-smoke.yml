name: Validate Supabase schema

on:
  push:
    branches:
      - main
      - audit/**
      - architecture/**
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/schema-smoke.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/schema-smoke.yml"

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create minimal Supabase Auth compatibility layer
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Apply schema migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610160001_initial_schema.sql
      - name: Run schema, trigger, and RLS smoke tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/schema_smoke.sql
