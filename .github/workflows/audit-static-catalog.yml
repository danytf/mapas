name: Audit static catalog precision flags

on:
  push:
    branches:
      - main
      - audit/**
      - architecture/**
    paths:
      - "index.html"
      - "scripts/audit-static-catalog.mjs"
      - "scripts/audit-persistence.mjs"
      - "scripts/audit-xss.mjs"
      - "scripts/audit-a11y.mjs"
      - "scripts/audit-cdn-integrity.mjs"
      - "scripts/audit-csp.mjs"
      - "scripts/test-paged-fetch.mjs"
      - "scripts/test-multiprovince.mjs"
      - "scripts/test-ui-fixes.mjs"
      - "scripts/test-list-performance.mjs"
      - "scripts/test-admin-panel.mjs"
      - "scripts/test-app-mejoras.mjs"
      - "scripts/test-calendario.mjs"
      - "scripts/test-centro.mjs"
      - "scripts/test-persistencia-expedientes.mjs"
      - "scripts/test-expedientes.mjs"
      - "scripts/test-cabecera-filtros.mjs"
      - "scripts/test-texto-minimo.mjs"
      - "scripts/test-ficha.mjs"
      - "scripts/test-ficha-mejorada.mjs"
      - "scripts/test-favoritos.mjs"
      - "scripts/test-tactil.mjs"
      - "scripts/test-paneles.mjs"
      - "scripts/test-escala.mjs"
      - "scripts/test-mapa-limites.mjs"
      - "scripts/test-mapa-vista.mjs"
      - "scripts/test-lista-jerarquia.mjs"
      - "scripts/test-oscuro-contraste.mjs"
      - "scripts/test-panel-graficas.mjs"
      - "scripts/test-carga-paralela.mjs"
      - "scripts/test-centro-detalles.mjs"
      - "scripts/test-rendimiento-cliente.mjs"
      - "scripts/test-a11y-fase-d.mjs"
      - "scripts/e2e-centro.mjs"
      - "scripts/dev/seed-permits-demo.mjs"
      - "scripts/dev/mock-supabase.mjs"
      - "scripts/dev/build-mock-site.mjs"
      - ".github/workflows/audit-static-catalog.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check audit script syntax
        run: node --check scripts/audit-static-catalog.mjs
      - name: Check browser persistence and Supabase write invariants
        run: |
          node --check scripts/audit-persistence.mjs
          node scripts/audit-persistence.mjs index.html
      - name: Test shared-state sanitizers
        run: node scripts/test-shared-state-sanitizers.mjs
      - name: Test paged loading of catalogue and shared state
        run: node scripts/test-paged-fetch.mjs
      - name: Test multi-province behaviour (no hard-coded Granada)
        run: node scripts/test-multiprovince.mjs
      - name: Test UI fixes (error messages, location save guard, menu keyboard)
        run: node scripts/test-ui-fixes.mjs
      - name: Test list and marker performance with many points
        run: node scripts/test-list-performance.mjs
      - name: Test accessibility beyond keyboard (contrast, names, live regions, focus)
        run: node scripts/test-a11y-fase-d.mjs index.html
      - name: Test admin panel screen
        run: node scripts/test-admin-panel.mjs
      - name: Test app improvements (municipality filter, add-point dropdowns, deactivate points)
        run: node scripts/test-app-mejoras.mjs
      - name: Test weekly calendar section
        run: node scripts/test-calendario.mjs
      - name: Test permits center section
        run: node scripts/test-centro.mjs
      - name: Test permits persistence (partial writes, duplicates, conflicts)
        run: node scripts/test-persistencia-expedientes.mjs
      - name: Test header indicators and collapsible filters
        run: node scripts/test-cabecera-filtros.mjs
      - name: Test minimum text size
        run: node scripts/test-texto-minimo.mjs
      - name: Test point sheet side panel
        run: node scripts/test-ficha.mjs
      - name: Test favorites
        run: node scripts/test-favoritos.mjs
      - name: Test touch targets
        run: node scripts/test-tactil.mjs
      - name: Test summary and admin panels
        run: node scripts/test-paneles.mjs
      - name: Test radius and font-size scale
        run: node scripts/test-escala.mjs
      - name: Test map bounds (the map cannot leave Spain)
        run: node scripts/test-mapa-limites.mjs
      - name: Test map view (overview, zone shortcuts, cluster density)
        run: node scripts/test-mapa-vista.mjs
      - name: Test improved point sheet (mini-map and permit timeline)
        run: node scripts/test-ficha-mejorada.mjs
      - name: Test list hierarchy (category icon, short title, status pill)
        run: node scripts/test-lista-jerarquia.mjs
      - name: Test dark mode contrast (list, summary panel, cluster density, zone shortcuts)
        run: node scripts/test-oscuro-contraste.mjs
      - name: Test summary panel charts (category ring, province bars, empty state)
        run: node scripts/test-panel-graficas.mjs
      - name: Test parallel catalogue load (per-province reads, total check, serial fallback)
        run: node scripts/test-carga-paralela.mjs
      - name: Test client performance with many points (fast paths, no duplicated work on load)
        run: node scripts/test-rendimiento-cliente.mjs
      - name: Test province outlines
        run: node scripts/test-provincias.mjs
      - name: Test bulk actions guarantees
        run: node scripts/test-acciones-masivas.mjs
      - name: Test permit-file business rules
        run: node scripts/test-expedientes.mjs
      - name: Test filter counters
        run: node scripts/test-contadores-filtros.mjs
      - name: Test Centro details (native checkbox theme, mobile header and batch bar, balanced Panel grid, Calendar title)
        run: node scripts/test-centro-detalles.mjs
      - name: Run XSS regression audit
        run: node scripts/audit-xss.mjs index.html
      - name: Check keyboard access to statistics panel rows
        run: node scripts/audit-a11y.mjs index.html
      - name: Check CDN resources are version-pinned with SRI
        run: |
          node --check scripts/audit-cdn-integrity.mjs
          node scripts/audit-cdn-integrity.mjs index.html
      - name: Check Content-Security-Policy covers every origin in use
        run: |
          node --check scripts/audit-csp.mjs
          node scripts/audit-csp.mjs index.html
      - name: Check inline JavaScript syntax in index.html
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, flags=re.I | re.S)
          out = Path("/tmp/mapa-inline-js")
          out.mkdir(exist_ok=True)
          count = 0
          for attrs, source in scripts:
              if re.search(r'\bsrc\s*=', attrs, flags=re.I) or not source.strip():
                  continue
              count += 1
              (out / f"script-{count:02d}.js").write_text(source, encoding="utf-8")
          if count == 0:
              raise SystemExit("No se encontraron scripts JavaScript inline para validar")
          print(f"Scripts inline extraídos para validar: {count}")
          PY
          for file in /tmp/mapa-inline-js/*.js; do
            echo "Validando $file"
            node --check "$file"
          done
      - name: Parse and audit static catalog
        run: node scripts/audit-static-catalog.mjs index.html catalog-audit-output
      - name: Show audit summary
        run: cat catalog-audit-output/summary.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: static-catalog-audit
          path: catalog-audit-output/
          if-no-files-found: error

  # Prueba de extremo a extremo en un Chrome real contra el Supabase simulado: recorre el Centro como administrador, como usuario de una provincia y en un móvil,
  # y falla ante cualquier excepción de la página. Es un trabajo aparte (no obligatorio en la protección de la rama) hasta comprobar que es estable en este entorno.
  e2e-centro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: E2E del Centro de permisos
        run: node scripts/e2e-centro.mjs
        env:
          CI: "true"
          CHROME_PATH: /usr/bin/google-chrome
