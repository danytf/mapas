<style>
  /* Layout: lista lateral + mapa; en móvil la lista pasa debajo del mapa. */
  :root {
    --bg: #f4f6f5;
    --panel: #ffffff;
    --fg: #17302b;
    --muted: #5d716c;
    --line: #d7e0dd;
    --accent: #0b7a68;
    --accent-fg: #ffffff;
    --warn: #a35a00;
    --warn-bg: #fdf0d9;
    --ok-bg: #e2f2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a18; --panel: #16231f; --fg: #e4efec; --muted: #94aaa4;
      --line: #28403a; --accent: #3fc3aa; --accent-fg: #06201b;
      --warn: #f0b562; --warn-bg: #3a2c12; --ok-bg: #173a33;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; position: relative; z-index: 2000;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px 1fr; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
  }
  .tools { padding: 12px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .tools input[type=search], .tools select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  button {
    font: inherit; padding: 8px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, li:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .status { font-size: 12px; color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  li {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  li:hover, li.active { background: var(--ok-bg); }
  .num {
    width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
    font-weight: 600; font-size: 12px; display: grid; place-items: center;
    font-variant-numeric: tabular-nums;
  }
  li.unplaced .num { background: var(--muted); }
  li strong { display: block; font-weight: 600; }
  li span.addr { color: var(--muted); font-size: 13px; }
  .tag {
    display: inline-block; margin-top: 4px; margin-right: 4px; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; background: var(--ok-bg); color: var(--accent);
  }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  #map { min-height: 0; min-width: 0; }
  .pin {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: #0b7a68; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    display: grid; place-items: center;
  }
  .pin b { transform: rotate(45deg); color: #fff; font: 600 11px system-ui, sans-serif; }
  .pform { display: grid; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #cfdcd8; }
  .pform label { font-size: 11px; color: #5b726c; display: grid; gap: 2px; }
  .pform select, .pform input, .pform textarea { font: inherit; padding: 4px 6px; border: 1px solid #b9ccc7; border-radius: 4px; width: 100%; background: #fff; color: #17302b; }
  .pform textarea { resize: vertical; min-height: 44px; }
  .pform button { padding: 6px 10px; background: #0b7a68; color: #fff; border-color: #0b7a68; }
  .stars { display: flex; align-items: center; gap: 2px; }
  .pform .stars button { padding: 0 1px; border: 0; background: none; color: #c4cfcc; font-size: 24px; line-height: 1; cursor: pointer; }
  .pform .stars button.on { color: #f5a623; }
  .pform .stars .sv { font-size: 11px; color: #5b726c; margin-left: 6px; }
  .pform .saved { font-size: 11px; color: #0b7a68; min-height: 14px; }
  .logo { height: 36px; width: auto; align-self: center; display: block; }
  header h1 { flex: 1; min-width: 0; }
  .menu { position: relative; margin-left: auto; align-self: center; }
  #menuBtn { width: 40px; height: 36px; padding: 0; display: grid; align-content: center; justify-items: center; gap: 4px; }
  #menuBtn span { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--fg); }
  #menuPanel .mh { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px 2px; }
  #menuPanel .mh:first-child { padding-top: 4px; }
  #menuPanel button:disabled { opacity: .45; cursor: default; }
  #menuPanel {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 1000; min-width: 280px;
    display: grid; gap: 4px; padding: 6px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #menuPanel[hidden] { display: none; }
  #menuPanel button { text-align: left; border: 0; background: transparent; }
  #menuPanel button:hover { background: var(--ok-bg); }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); padding: 16px; width: min(420px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { display: grid; gap: 10px; }
  dialog h2 { margin: 0; font-size: 16px; }
  dialog label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  dialog input, dialog select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; }
  dialog .msg { font-size: 12px; color: var(--warn); min-height: 16px; }
  .pform button.danger { background: #fff; color: #b3261e; border-color: #b3261e; }
  .placing #map { cursor: crosshair; }
  .legend-box { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; max-width: 230px; box-shadow: 0 1px 5px rgba(0,0,0,.3); }
  .legend-box summary { cursor: pointer; font-weight: 600; }
  .legend-box h4 { margin: 8px 0 3px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .legend-box div.it { display: flex; align-items: center; gap: 6px; line-height: 1.5; }
  .legend-box i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .legend-box i.ring { background: #9aa8a4; border: 3px solid; width: 15px; height: 15px; }
  .leaflet-popup-content { font: 13px/1.4 system-ui, sans-serif; color: #17302b; }
  .leaflet-popup-content strong { font-size: 14px; }
  .note { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  @media (max-width: 760px) {
    h1 { font-size: 15px; }
    .logo { height: 28px; }
    body { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
    #map { order: -1; }
    aside { border-right: 0; }
    ul { overflow: visible; }
  }
</style>
</head>

const CACHE_KEY = "cs-granada-geo-v3";
const VIEWBOX = "-4.40,38.10,-2.50,36.65"; // provincia de Granada: izquierda, arriba, derecha, abajo
const $ = (s) => document.querySelector(s);
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch (e) { cache = {}; }

CENTERS.forEach((c) => { const q = PRECOMPUTED[c.name]; if (q) cache[c.id] = { lat: q[0], lon: q[1], approx: q[2] === 1 || undefined }; });
CENTERS.forEach((c) => { if (c.custom) { const p = customs.find((x) => x.name === c.name); cache[c.id] = { lat: p.lat, lon: p.lon, approx: p.approx || undefined }; } });
const saveCache = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); } catch (e) {} };

const map = L.map("map", { zoomControl: true }).setView([37.1773, -3.5986], 13);
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, attribution: "Tiles © Esri — Source: Esri, HERE, Garmin, OpenStreetMap contributors | Geocodificación: © Instituto Geográfico Nacional de España (CartoCiudad)"
}).addTo(map);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap contributors | Geocodificación: © Instituto Geográfico Nacional de España (CartoCiudad)"
});
L.control.layers({ "Esri calles": esri, "OpenStreetMap (solo si sirves la página por http)": osm }, null, { position: "topright" }).addTo(map);

const markers = {};
const cluster = L.markerClusterGroup({ maxClusterRadius: 38, showCoverageOnHover: false, disableClusteringAtZoom: 17 }).addTo(map);
let touched = false;
map.on("dragstart", () => { touched = true; });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Categorías: mismas que la lista de recursos (id, descripción). */
const TIPOS = [
  [1, "Hospital", "#c0392b"], [2, "Centro de salud", "#0b7a68"], [3, "Supermercado", "#b83280"], [4, "Centro comercial", "#2b6cb0"],
  [5, "Entidad oficial", "#475569"], [6, "Gimnasios", "#d9730d"], [7, "IKEA", "#e0a800"], [8, "Leroy Merlin", "#65a30d"],
  [9, "Decathlon", "#0891b2"], [10, "Carrefour", "#7c3aed"], [11, "Correos", "#a16207"], [12, "El Corte Inglés", "#15803d"],
  [13, "Bricolaje", "#92400e"], [14, "MediaMarkt", "#dc2626"], [15, "Estaciones", "#78716c"], [16, "Tiendas", "#be185d"], [17, "Eventos", "#4f46e5"]
];
const colorOf = (c) => (TIPOS.find((t) => t[1] === c.tipo) || [0, 0, "#0b7a68"])[2];
const matchTipo = (c, t) => !t || c.tipo === t;

/* Estado del permiso por punto (se guarda en localStorage, clave = nombre del punto). */
const ESTADOS = [["sin", "Sin solicitar", "#ffffff"], ["solicitado", "Solicitado", "#fbbf24"], ["concedido", "Concedido", "#22c55e"], ["denegado", "Denegado", "#111827"]];
const PERM_KEY = "permisos-captacion-granada-v1";
let permits = {};
try { permits = JSON.parse(localStorage.getItem(PERM_KEY) || "{}"); } catch (e) { permits = {}; }
const savePermits = () => { try { localStorage.setItem(PERM_KEY, JSON.stringify(permits)); } catch (e) {} };
let removed = new Set(loadJSON(REMOVED_KEY, []));
const saveRemoved = () => { try { localStorage.setItem(REMOVED_KEY, JSON.stringify([...removed])); } catch (e) {} };
const isOut = (c) => removed.has(c.name);
const permOf = (c) => permits[c.name] || { estado: "sin", fecha: "", contacto: "", notas: "", valoracion: 0 };
const stars = (n) => "★".repeat(n) + "☆".repeat(5 - n);
const estadoInfo = (k) => ESTADOS.find((e) => e[0] === k) || ESTADOS[0];

const addrOf = (c) => (c.street ? c.street + ", " : "") + (c.town || "Granada");

function makeIcon(c) {
  const e = estadoInfo(permOf(c).estado);
  return L.divIcon({
    className: "",
    html: '<div class="pin" style="background:' + colorOf(c) + ";border-color:" + e[2] + (e[0] === "sin" ? "" : ";border-width:3px") + '"><b>' + c.id + "</b></div>",
    iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -24]
  });
}

function popupFor(c, pos) {
  const p = permOf(c);
  const el = document.createElement("div");
  el.innerHTML =
    "<strong>" + esc(c.name) + "</strong><br>" + esc(addrOf(c)) + (c.sub ? "<br>" + esc(c.tipo + " · " + c.sub) : "") +
    (c.extra ? "<br><em>" + esc(c.extra) + "</em>" : "") +
    (c.prov ? "<br><em>El catálogo oficial no incluye la calle" + (pos.approx ? "; posición aproximada (centro del municipio)" : "") + "</em>" : "") +
    (c.conf ? "" : "<br><em>Dirección por confirmar</em>") +
    '<div class="pform"><div><span style="font-size:11px;color:#5b726c">Valoración para captación</span><div class="stars" role="radiogroup" aria-label="Valoración de 1 a 5 estrellas">' +
    [1, 2, 3, 4, 5].map((n) => '<button type="button" data-n="' + n + '" aria-label="' + n + ' estrellas">★</button>').join("") + '<span class="sv"></span></div></div>' +
    '<label>Estado del permiso<select class="f-estado">' +
    ESTADOS.map((e) => '<option value="' + e[0] + '"' + (e[0] === p.estado ? " selected" : "") + ">" + e[1] + "</option>").join("") +
    '</select></label><label>Fecha<input class="f-fecha" type="date" value="' + esc(p.fecha || "") + '"></label>' +
    '<label>Contacto (nombre, teléfono, email)<input class="f-contacto" type="text" value="' + esc(p.contacto || "") + '"></label>' +
    '<label>Notas<textarea class="f-notas">' + esc(p.notas || "") + '</textarea></label>' +
    '<button type="button" class="f-save">Guardar permiso</button><button type="button" class="f-del danger">' + (c.custom ? "Eliminar punto" : "Quitar del mapa") + '</button><div class="saved"></div></div>';
  L.DomEvent.disableClickPropagation(el);
  L.DomEvent.disableScrollPropagation(el);
  let val = p.valoracion || 0;
  const paint = () => {
    el.querySelectorAll(".stars button").forEach((b) => b.classList.toggle("on", +b.dataset.n <= val));
    el.querySelector(".sv").textContent = val ? val + " de 5" : "sin valorar";
  };
  const commit = () => {
    const v = {
      estado: el.querySelector(".f-estado").value, fecha: el.querySelector(".f-fecha").value,
      contacto: el.querySelector(".f-contacto").value.trim(), notas: el.querySelector(".f-notas").value.trim(), valoracion: val
    };
    if (v.estado === "sin" && !v.fecha && !v.contacto && !v.notas && !v.valoracion) delete permits[c.name]; else permits[c.name] = v;
    savePermits();
    if (markers[c.id]) markers[c.id].setIcon(makeIcon(c));
    refreshSelects();
    renderList();
    el.querySelector(".saved").textContent = "Guardado";
  };
  el.querySelectorAll(".stars button").forEach((b) => b.addEventListener("click", () => { val = val === +b.dataset.n ? 0 : +b.dataset.n; paint(); commit(); }));
  paint();
  el.querySelector(".f-save").addEventListener("click", commit);
  let armed = false;
  const del = el.querySelector(".f-del");
  del.addEventListener("click", () => {
    if (!armed) { armed = true; del.textContent = "¿Seguro? Pulsa otra vez"; return; }
    if (c.custom) {
      customs = customs.filter((x) => x.name !== c.name);
      try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs)); } catch (e) {}
      location.reload();
    } else {
      removed.add(c.name); saveRemoved(); map.closePopup(); refreshSelects(); renderList();
    }
  });
  return el;
}

function makeMarker(c) {
  const pos = cache[c.id];
  if (!pos || markers[c.id] || isOut(c)) return;
  const m = L.marker([pos.lat, pos.lon], { icon: makeIcon(c), title: c.name });
  cluster.addLayer(m);
  m.bindPopup(() => popupFor(c, pos), { minWidth: 230 });
  m.on("click", () => highlight(c.id, false));
  markers[c.id] = m;
}

function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const tipo = $("#tipo").value;
  const est = $("#permiso").value;
  const vf = $("#valor").value;
  const rate = (c) => permOf(c).valoracion || 0;
  const okVal = (c) => !vf || (vf === "sin" ? !rate(c) : rate(c) >= +vf);
  const ul = $("#list");
  ul.innerHTML = "";
  const order = $("#orden").value === "val" ? [...CENTERS].sort((a, b) => rate(b) - rate(a) || a.id - b.id) : CENTERS;
  order.forEach((c) => {
    const visible = !isOut(c) && matchTipo(c, tipo) && (!est || permOf(c).estado === est) && okVal(c) &&
      (!q || (c.name + " " + c.street + " " + (c.town || "Granada")).toLowerCase().includes(q));
    if (markers[c.id]) {
      const on = cluster.hasLayer(markers[c.id]);
      if (visible && !on) cluster.addLayer(markers[c.id]);
      if (!visible && on) cluster.removeLayer(markers[c.id]);
    }
    if (!visible) return;
    const li = document.createElement("li");
    li.tabIndex = 0;
    li.dataset.id = c.id;
    if (!cache[c.id]) li.classList.add("unplaced");
    li.innerHTML =
      '<div class="num" style="background:' + colorOf(c) + ';color:#fff">' + c.id + "</div><div><strong>" + esc(c.name) + '</strong><span class="addr">' +
      esc(addrOf(c)) + "</span><br>" +
      '<span class="tag">' + esc(c.tipo + (c.sub ? " · " + c.sub : "")) + "</span>" +
      (permOf(c).valoracion ? '<span class="tag" style="background:#fff3d6;color:#8a5a00">' + stars(permOf(c).valoracion) + "</span>" : "") +
      (permOf(c).estado !== "sin" ? '<span class="tag" style="background:' + estadoInfo(permOf(c).estado)[2] + ';color:' + (permOf(c).estado === "concedido" || permOf(c).estado === "solicitado" ? "#111" : "#fff") + '">' + estadoInfo(permOf(c).estado)[1] + (permOf(c).fecha ? " · " + esc(permOf(c).fecha) : "") + "</span>" : "") +
      (cache[c.id] && cache[c.id].approx ? '<span class="tag warn">Ubicación aproximada</span>' : "") +
      (c.conf ? "" : '<span class="tag warn">Por confirmar</span>') +
      (cache[c.id] ? "" : '<span class="tag warn">Sin ubicar</span>') + "</div>";
    li.addEventListener("click", () => highlight(c.id, true));
    li.addEventListener("keydown", (e) => { if (e.key === "Enter") highlight(c.id, true); });
    ul.appendChild(li);
  });
}

function highlight(id, fly) {
  document.querySelectorAll("li.active").forEach((n) => n.classList.remove("active"));
  const li = document.querySelector('li[data-id="' + id + '"]');
  if (li) { li.classList.add("active"); li.scrollIntoView({ block: "nearest" }); }
  const m = markers[id];
  if (m && fly) { touched = true; cluster.zoomToShowLayer(m, () => { map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 16), { duration: 0.6 }); m.openPopup(); }); }
}

function fitAll() {
  const pts = Object.values(markers).filter((m) => cluster.hasLayer(m)).map((m) => m.getLatLng());
  if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.12));
}

async function nominatim(q, vb) {
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es" +
    "&viewbox=" + (vb || VIEWBOX) + "&bounded=1&q=" + encodeURIComponent(q);
  const r = await fetch(url, { headers: { "Accept-Language": "es" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  return j.length ? { lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon) } : null;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function locateAll() {
  const pending = CENTERS.filter((c) => !cache[c.id] && !isOut(c));
  let done = CENTERS.length - pending.length;
  const tick = () => {
    $("#prog").style.width = Math.round((done / CENTERS.length) * 100) + "%";
    const placed = CENTERS.filter((c) => cache[c.id]).length;
    $("#status").textContent = placed + " de " + CENTERS.length + " ubicados" +
      (done < CENTERS.length ? " · buscando posiciones…" : "");
  };
  tick();
  CENTERS.forEach(makeMarker);
  fitAll();
  for (const c of pending) {
    try {
      let pos;
      if (c.prov || c.town) {
        // 1) centro del municipio (una consulta por municipio, en caché); 2) calle o nombre dentro de ~4 km; 3) si no, el centro.
        const k = "t:" + c.town;
        if (!cache[k]) { const t = await nominatim(c.town + ", Granada"); if (t) cache[k] = t; await sleep(1100); }
        const t = cache[k];
        if (t) {
          const d = c.street ? 0.06 : 0.04, vb = [t.lon - d, t.lat + d, t.lon + d, t.lat - d].join(",");
          if (c.street) { pos = await nominatim(c.street + ", " + c.town, vb); if (!pos) await sleep(1100); }
          if (!pos) pos = { lat: t.lat, lon: t.lon, approx: true };
        }
      } else {
        pos = await nominatim(c.street + ", " + (c.town || "Granada"));
        if (!pos) { await sleep(1100); pos = await nominatim(c.q2 || (c.name.replace(/^CS /, "Centro de Salud ") + ", Granada")); }
      }
      if (pos) { cache[c.id] = pos; saveCache(); makeMarker(c); }
    } catch (e) {
      $("#status").textContent = "No se pudo consultar OpenStreetMap (" + e.message + "). Recarga más tarde.";
    }
    done++; tick(); if (done % 10 === 0 || done === CENTERS.length) renderList(); if (!touched && done % 10 === 0) fitAll();
    await sleep(1100); // límite de uso de Nominatim: 1 petición por segundo
  }
  tick();
}

let fitTimer;
const refilter = () => { renderList(); clearTimeout(fitTimer); fitTimer = setTimeout(() => { touched = false; fitAll(); }, 200); };
$("#q").addEventListener("input", refilter);
$("#tipo").addEventListener("change", refilter);
$("#copy").addEventListener("click", async () => {
  const out = CENTERS.map((c) => ({
    id: c.id, nombre: c.name, tipo: c.tipo, direccion: addrOf(c), direccion_confirmada: c.conf && !c.prov, ubicacion_aproximada: !!(cache[c.id] && cache[c.id].approx), lat: cache[c.id] ? cache[c.id].lat : null, lon: cache[c.id] ? cache[c.id].lon : null
  }));
  const txt = JSON.stringify(out, null, 2);
  try { await navigator.clipboard.writeText(txt); $("#status").textContent = "JSON copiado al portapapeles."; }
  catch (e) { prompt("Copia el JSON:", txt); }
});

const lg = L.control({ position: "bottomleft" });
lg.onAdd = () => {
  const d = L.DomUtil.create("div", "legend-box");
  d.innerHTML = '<details' + (window.innerWidth > 760 ? " open" : "") + '><summary>Leyenda</summary><div id="lgBody"></div></details>';
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
};
lg.addTo(map);

function refreshSelects() {
  const vis = CENTERS.filter((c) => !isOut(c));
  const tv = $("#tipo").value, pv = $("#permiso").value;
  $("#tipo").innerHTML = '<option value="">Categoría: todas</option>' +
    TIPOS.map(([i, t]) => '<option value="' + t + '">' + i + " · " + t + " (" + vis.filter((c) => c.tipo === t).length + ")</option>").join("");
  $("#permiso").innerHTML = '<option value="">Permiso: todos</option>' +
    ESTADOS.map(([k, t]) => '<option value="' + k + '">' + t + " (" + vis.filter((c) => permOf(c).estado === k).length + ")</option>").join("");
  const vv = $("#valor").value, ov = $("#orden").value;
  $("#valor").innerHTML = '<option value="">Valoración: todas</option><option value="5">★★★★★ (5)</option><option value="4">★★★★☆ o más</option><option value="3">★★★☆☆ o más</option><option value="sin">Sin valorar</option>';
  $("#orden").innerHTML = '<option value="">Orden: normal</option><option value="val">Mejor valorados</option>';
  $("#tipo").value = tv; $("#permiso").value = pv; $("#valor").value = vv; $("#orden").value = ov;
  $("#lgBody").innerHTML = "<h4>Color: categoría</h4>" +
    TIPOS.filter(([i, t]) => vis.some((c) => c.tipo === t)).map(([i, t, col]) => '<div class="it"><i style="background:' + col + '"></i>' + t + "</div>").join("") +
    "<h4>Borde: permiso</h4>" +
    ESTADOS.map(([k, t, col]) => '<div class="it"><i class="ring" style="border-color:' + (k === "sin" ? "#ffffff;box-shadow:0 0 0 1px #9aa8a4" : col) + '"></i>' + t + "</div>").join("");
  const nr = CENTERS.filter(isOut).length;
  $("#restore").textContent = "Restaurar puntos quitados (" + nr + ")";
  $("#restore").disabled = !nr;
}
refreshSelects();

$("#permiso").addEventListener("change", refilter);
$("#valor").addEventListener("change", refilter);
$("#orden").addEventListener("change", renderList);
(() => {
  const btn = $("#menuBtn"), panel = $("#menuPanel");
  const set = (open) => { panel.hidden = !open; btn.setAttribute("aria-expanded", open); };
  btn.addEventListener("click", (e) => { e.stopPropagation(); set(panel.hidden); });
  panel.addEventListener("click", () => set(false));
  document.addEventListener("click", (e) => { if (!panel.contains(e.target)) set(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") set(false); });
})();
const download = (name, text, type) => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
};
$("#csv").addEventListener("click", () => {
  const q = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const head = ["id", "categoria", "subtipo", "nombre", "direccion", "municipio", "lat", "lon", "ubicacion_aproximada", "origen", "valoracion", "estado_permiso", "fecha", "contacto", "notas"];
  const rows = CENTERS.filter((c) => !isOut(c)).map((c) => {
    const p = permOf(c), pos = cache[c.id] || {};
    return [c.id, c.tipo, c.sub || "", c.name, c.street, c.town || "Granada", pos.lat || "", pos.lon || "", pos.approx ? "sí" : "", c.custom ? "agregado" : "base", p.valoracion || "", estadoInfo(p.estado)[1], p.fecha, p.contacto, p.notas].map(q).join(";");
  });
  download("permisos-captacion-granada.csv", "\ufeff" + head.join(";") + "\r\n" + rows.join("\r\n"), "text/csv;charset=utf-8");
});
$("#bak").addEventListener("click", () => download("copia-mapa-recursos-granada.json", JSON.stringify({ version: 2, permisos: permits, puntos_propios: customs, quitados: [...removed] }, null, 2), "application/json"));
$("#imp").addEventListener("click", () => $("#impf").click());
$("#impf").addEventListener("change", async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const pm = d.version === 2 ? d.permisos : d;
    let n = 0, addedC = 0;
    (d.puntos_propios || []).forEach((p) => {
      if (p && p.name && typeof p.lat === "number" && !customs.some((x) => x.name === p.name) && !CENTERS.some((c) => c.name === p.name)) { customs.push(p); addedC++; }
    });
    const names = new Set([...CENTERS.map((c) => c.name), ...customs.map((x) => x.name)]);
    Object.keys(pm || {}).forEach((k) => { if (names.has(k) && pm[k] && pm[k].estado) { permits[k] = pm[k]; n++; } });
    (d.quitados || []).forEach((k) => { if (names.has(k)) removed.add(k); });
    savePermits(); saveRemoved();
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs)); } catch (err) {}
    if (addedC) { location.reload(); return; }
    refreshSelects();
    Object.keys(markers).forEach((id) => markers[id].setIcon(makeIcon(CENTERS[id - 1])));
    renderList();
    $("#status").textContent = n + " permisos cargados.";
  } catch (err) { $("#status").textContent = "Archivo no válido: " + err.message; }
  e.target.value = "";
});

/* Restaurar puntos quitados */
$("#restore").addEventListener("click", () => {
  removed = new Set(); saveRemoved();
  CENTERS.forEach(makeMarker);
  refreshSelects(); renderList();
});

/* Agregar punto nuevo */
const dlg = $("#dlg");
$("#n-tipo").innerHTML = TIPOS.map(([i, t]) => '<option value="' + t + '">' + i + " · " + t + "</option>").join("");
const nmsg = (t) => { $("#n-msg").textContent = t; };
function readForm() {
  const name = $("#n-name").value.trim(), town = $("#n-town").value.trim() || "Granada", street = $("#n-street").value.trim();
  if (!name) { nmsg("Escribe un nombre."); return null; }
  if (CENTERS.some((c) => c.name.toLowerCase() === name.toLowerCase())) { nmsg("Ya existe un punto con ese nombre."); return null; }
  return { name, tipo: $("#n-tipo").value, town, street };
}
function addCustom(rec, pos) {
  const p = { ...rec, lat: pos.lat, lon: pos.lon };
  customs.push(p);
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs)); } catch (e) {}
  const c = { id: CENTERS.length + 1, name: p.name, tipo: p.tipo, sub: "", town: p.town, street: p.street, conf: true, custom: true, extra: "Punto agregado manualmente" };
  CENTERS.push(c);
  cache[c.id] = { lat: p.lat, lon: p.lon };
  makeMarker(c); refreshSelects(); renderList();
  $("#tipo").value = ""; $("#permiso").value = ""; renderList();
  touched = true;
  cluster.zoomToShowLayer(markers[c.id], () => { map.flyTo(markers[c.id].getLatLng(), Math.max(map.getZoom(), 16), { duration: 0.6 }); markers[c.id].openPopup(); });
  highlight(c.id, false);
}
$("#add").addEventListener("click", () => { nmsg(""); $("#addForm").reset(); $("#n-town").value = "Granada"; dlg.showModal(); });
$("#n-cancel").addEventListener("click", () => dlg.close());
$("#n-geo").addEventListener("click", async () => {
  const rec = readForm(); if (!rec) return;
  if (!rec.street) { nmsg("Sin dirección no se puede buscar: indica la calle o usa “Colocar en el mapa”."); return; }
  nmsg("Buscando…");
  try {
    const pos = await nominatim(rec.street + ", " + rec.town);
    if (!pos) { nmsg("No se ha encontrado esa dirección. Prueba a cambiarla o usa “Colocar en el mapa”."); return; }
    dlg.close(); addCustom(rec, pos);
  } catch (e) { nmsg("No se pudo consultar OpenStreetMap (" + e.message + ")."); }
});
$("#n-click").addEventListener("click", () => {
  const rec = readForm(); if (!rec) return;
  dlg.close();
  document.body.classList.add("placing");
  $("#status").textContent = "Haz clic en el mapa donde está “" + rec.name + "” (Escape para cancelar).";
  const stop = () => { document.body.classList.remove("placing"); map.off("click", onClick); document.removeEventListener("keydown", onKey); };
  const onClick = (ev) => { stop(); $("#status").textContent = "Punto agregado."; addCustom(rec, { lat: ev.latlng.lat, lon: ev.latlng.lng }); };
  const onKey = (ev) => { if (ev.key === "Escape") { stop(); $("#status").textContent = "Cancelado."; } };
  map.on("click", onClick); document.addEventListener("keydown", onKey);
});

renderList();
locateAll().then(renderList);
</script>
